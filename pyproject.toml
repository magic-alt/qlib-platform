[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tushare-qlib-a-share"
version = "0.3.0"
description = "Auditable A-share quant research and alpha factory built on Microsoft Qlib"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
keywords = [
  "qlib",
  "quantitative-finance",
  "a-share",
  "alpha-research",
  "machine-learning",
  "backtesting",
  "walk-forward",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<2.0",
  "pyarrow>=14,<20",
  "duckdb>=1.0,<2.0",
  "PyYAML>=6,<7",
  "python-dotenv>=1.0,<2.0",
  "loguru>=0.7,<1.0",
  "matplotlib>=3.8,<4.0",
  "reportlab>=4.0,<5.0",
  "pypdf>=5.0,<7.0",
  "fastjsonschema>=2.20,<3",
  "argon2-cffi>=23.1,<26",
]

[project.urls]
Homepage = "https://github.com/magic-alt/qlib-platform"
Repository = "https://github.com/magic-alt/qlib-platform"
Documentation = "https://github.com/magic-alt/qlib-platform/blob/main/docs/index.md"
Issues = "https://github.com/magic-alt/qlib-platform/issues"
Changelog = "https://github.com/magic-alt/qlib-platform/blob/main/CHANGELOG.md"

[project.optional-dependencies]
data = [
  "tushare>=1.4.0,<2.0",
  "tenacity>=8.2,<10",
  "pymysql>=1.1,<2.0",
]
qlib = [
  "pyqlib==0.9.7",
  "lightgbm==4.6.0",
]
pytorch = [
  "torch>=2.2,<3.0",
]
xgboost = [
  "xgboost>=2.0,<4.0",
]
all = [
  "tushare>=1.4.0,<2.0",
  "tenacity>=8.2,<10",
  "pymysql>=1.1,<2.0",
  "pyqlib==0.9.7",
  "lightgbm==4.6.0",
  "xgboost>=2.0,<4.0",
]
dev = [
  "pyqlib==0.9.7",
  "lightgbm==4.6.0",
  "xgboost>=2.0,<4.0",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
]
docs = [
  "mkdocs-material==9.7.7",
]

[project.scripts]
tq = "tushare_qlib.cli:main"
tq-render-scheduler = "tushare_qlib.scheduler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"contracts" = ["contracts/*.json", "contracts/README.md"]
"configs" = ["configs/*.yaml"]
"configs/alpha_taxonomy" = ["configs/alpha_taxonomy/*.yaml"]
"configs/attribution" = ["configs/attribution/*.yaml"]
"configs/explanation" = ["configs/explanation/*.yaml"]
"configs/model_profiles" = ["configs/model_profiles/*.yaml"]
"configs/portfolio" = ["configs/portfolio/*.yaml"]
"configs/regimes" = ["configs/regimes/*.yaml"]
"configs/research" = ["configs/research/*.yaml"]
"configs/synthesis" = ["configs/synthesis/*.yaml"]
"deploy/systemd" = ["deploy/systemd/*"]
"deploy/launchd" = ["deploy/launchd/*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
