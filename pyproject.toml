[build-system]
requires = []
build-backend = "local_build_meta"
backend-path = ["."]

[project]
name = "tushare-qlib-a-share"
version = "0.1.0"
description = "Tushare Pro to Microsoft Qlib data pipeline for A-share research"
requires-python = ">=3.10"
dependencies = [
  "tushare>=1.4.0",
  "pandas>=2.0",
  "numpy>=1.24,<2.0",
  "pyarrow>=14",
  "duckdb>=1.0",
  "PyYAML>=6",
  "python-dotenv>=1.0",
  "tenacity>=8.2",
  "loguru>=0.7",
  "lightgbm>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
tq = "tushare_qlib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
