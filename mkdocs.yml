site_name: qlib-platform
site_description: Auditable A-share quant research and alpha factory built on Microsoft Qlib
site_author: qlib-platform contributors
site_url: https://magic-alt.github.io/qlib-platform/
repo_name: magic-alt/qlib-platform
repo_url: https://github.com/magic-alt/qlib-platform
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 qlib-platform contributors · Apache-2.0

theme:
  name: material
  language: en
  logo: assets/brand/qlib-platform-mark.svg
  favicon: assets/brand/qlib-platform-mark.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/magic-alt/qlib-platform
      name: qlib-platform on GitHub

