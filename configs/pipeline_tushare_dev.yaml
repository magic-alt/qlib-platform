experiment:
  data_release: cn_tushare_v1
  alpha:
    pack: alpha158_pit_v1
  label:
    spec: return_5d_t1_v1
  split:
    profile: wf_1500_126_63_v1
  model:
    profile: model_profiles/lightgbm_auto.yaml
  portfolio:
    policy: topk_dropout_v1
  benchmark: SH000300
# Development and standalone-test profile only. Platform owns production
# TuShare ingestion and DataRelease publication.
project_root: ./data
storage:
  registry_path: ./data/registry/qlib.sqlite
start_date: "20160104"
end_date: "20260810"
calendar_end_date: "20261231"

data_source:
  # Use `tushare` for API pulls or `lean_mysql` to read from lean-platform MySQL.
  kind: tushare
  mysql:
    # `lean_canonical_v1` reads lean-platform's governed canonical tables.
    schema: lean_canonical_v1
    source: tushare
    universe: CSI300
    readonly: true
    batch_size: 100000
    # Either use DSN or explicit host/user/password/database.
    # dsn: ${LEAN_MYSQL_DSN}
    host: ""
    port: 3306
    user: ""
    password: ""
    database: ""
    charset: utf8mb4
    connect_timeout: 10
    # Optional table remapping for legacy database schemas.
    tables: {}
    # Optional per-endpoint SQL override, used when table/column naming differs.
    # Query placeholders are `%(trade_date)s`, `%(exchange)s`, `%(list_status)s`, etc.
    endpoints: {}

tushare:
  calls_per_minute: 180
  max_attempts: 6
  base_sleep_seconds: 2.0
  max_sleep_seconds: 60.0
  jitter_ratio: 0.15
  extended_max_workers: 8
  optional_endpoints:
    moneyflow: true
    stock_st: true
    suspend_d: true
    stk_limit: true

qlib:
  repo_path: ${QLIB_REPO}
  dataset_dir: ${QLIB_DATA_URI}
  frequency: day
  dataset_version: cn_tushare_v1
  dataset_name: cn_tushare
  dataset_ref: research-current
  versions_root: ./data/qlib/versions
  export:
    copy_on_write_update: true
    max_workers: 4
    backup_keep: 3
  include_fields:
    - open
    - high
    - low
    - close
    - volume
    - money
    - vwap
    - factor
    - change
    - paused
    - turnover_rate
    - turnover_rate_f
    - volume_ratio
    - pe
    - pe_ttm
    - pb
    - ps
    - ps_ttm
    - dv_ratio
    - dv_ttm
    - total_share
    - float_share
    - free_share
    - total_mv
    - circ_mv
    - net_mf_amount
    - big_net_amount
    - up_limit
    - down_limit
    - is_limit_up
    - is_limit_down
    - is_st
    - listed_days
    - roe_waa_pit
    - roa_pit
    - netprofit_margin_pit
    - netprofit_yoy_pit
    - or_yoy_pit
    - debt_to_assets_pit
    - ocf_to_or_pit

data_sync:
  timezone: Asia/Shanghai
  # TuShare daily_basic normally completes by 17:00.
  ready_after: "17:30"
  market_lookback_trading_days: 5
  corporate_action_lookback_calendar_days: 5

production:
  # A refit job may create STAGED bundles weekly, but activation is always manual.
  refit_cadence: weekly_first_trading_day
  max_model_age_days: 45
  max_train_data_lag_calendar_days: 20
  min_cross_section_coverage: 0.80
  min_score_dispersion_ratio: 0.10
  max_score_dispersion_ratio: 10.0
  max_score_mean_shift_std: 5.0
  max_score_psi: 0.50
  drift:
    enabled: true
    max_score_psi: 0.50
    min_topk_overlap: 0.30
    max_rank_turnover: 0.25
  notification:
    channel: feishu
    webhook_env: FEISHU_WEBHOOK_URL
    secret_env: FEISHU_WEBHOOK_SECRET
    retry_delays_seconds: [2, 10, 30]

universe:
  instruments: csi300
  label: PIT CSI300
  index_code: 399300.SZ
  membership_effective_lag_days: 1
  min_listed_days: 120
  min_circ_mv_yuan: 2000000000
  min_money_20d_yuan: 20000000
  exclude_st: true
  allow_unknown_st: false

research:
  # Resolved relative to this pipeline config. Override with --model-profile.
  model_profile: model_profiles/lightgbm_auto.yaml
  min_history_days: 2200
  # Forecast horizon and minimum holding period are independent. The model is
  # re-evaluated daily; portfolio responsiveness is governed separately by the
  # execution policy (TopkDropout hold_thresh or RankBuffer exit buffer).
  label_horizon_days: 5
  random_seed: 42
  num_threads: 8
  qlib_kernels: 4
  # Joblib's robust process backend; required for supported Windows research runs.
  joblib_backend: loky
  feature_store:
    enabled: true
    format: parquet
    partition: year
  walk_forward:
    train_days: 1500
    valid_days: 126
    test_days: 63
    min_rolling_oos_observations: 252
    min_holdout_observations: 252
    purge_days: 6
    embargo_days: 6
    label_buffer_days: 6
  backtest_account: 500000
  allow_zero_benchmark: false
  deal_price: open
  limit_threshold: 0.095
  open_cost: 0.00035
  close_cost: 0.00085
  min_cost: 5
  benchmark: SH000300
  signal_lag_days: 1
  trade_unit: 100
  max_participation_rate: 0.05
  # Dirty revisions may produce research CANDIDATE runs, but can never be promoted.
  allow_dirty_research: true
  promotion_thresholds:
    min_observations: 252
    min_ic_mean: 0.01
    min_rank_ic_mean: 0.02
    min_icir: 0.50
    min_long_short_annualized: 0.05
    # A strong ranking signal may satisfy the stability gate even if Pearson ICIR does not.
    min_rank_icir: 0.50
    review_min_icir: 0.30
    review_min_rank_icir: 0.40
    min_excess_ir: 0.50
    max_drawdown: 0.20
    require_unique_artifact: true

strategy:
  # Canonical strategy source for research and manifests.
  topk_dropout:
    topk: 30
    n_drop: 5
    hold_thresh: 5
    only_tradable: true
    forbid_all_trade_at_limit: true
    risk_degree: 0.95

portfolio:
  top_n: 20
  min_score: null
  weighting: score_vol
  max_position: 0.08
  max_exposure: 0.90
  max_group_exposure: 0.25
  max_turnover: 0.30
  min_position: 0.002
  volatility_floor: 0.01


risk:
  max_gross_exposure: 0.95
  max_single_name: 0.10
  max_sector_exposure: 0.30
  max_daily_loss: 0.03
  kill_switch: false
  exposure_overlay:
    enabled: false
    target_annual_volatility: 0.15
    soft_drawdown: 0.10
    hard_drawdown: 0.20
    minimum_signal_dispersion: 0.05
    minimum_exposure_scale: 0.0
    maximum_exposure_scale: 1.0
