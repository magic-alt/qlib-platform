extends: pipeline_tushare_dev.yaml

# Default autonomous Research Plane profile. Copy .env.example to .env and this
# profile works without editing YAML. Advanced overrides remain optional.
mode: standalone
project_root: ./data
project_root_env: QLIB_DATA_ROOT

experiment:
  # Standalone research binds the active immutable release through the registry.
  # Users never need to paste a ds_* identifier into this file.
  data_release: null
  alpha:
    pack: alpha158_market_v1

storage:
  registry_path: ""

data_source:
  kind: auto

release_store:
  kind: file
  # Empty means <resolved project_root>/releases.
  root: ""
  publish_on_sync: true
  # Normal standalone UX exposes one active release. Older immutable releases are
  # archived and remain addressable by exact ID for audit/replay.
  active_keep: 1

qlib:
  # Optional .env overrides; blank values fall back to platform-managed paths.
  repo_path: ${QLIB_REPO}
  dataset_dir: ${QLIB_DATA_URI}
  versions_root: ""
  dataset_name: cn_standalone
  dataset_version: local
  dataset_ref: standalone-current
