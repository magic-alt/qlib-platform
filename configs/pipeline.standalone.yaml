extends: pipeline_tushare_dev.yaml

# Default autonomous Research Plane profile. Copy .env.example to .env and this
# profile works without editing YAML. Advanced overrides remain optional.
mode: standalone
project_root: ./data
project_root_env: QLIB_DATA_ROOT

experiment:
  # Standalone research binds the active immutable release through the registry.
  # Users never need to paste a ds_* identifier into this file.
  data_release: null
  alpha:
    pack: alpha158_market_v1

storage:
  registry_path: ""

data_source:
  kind: auto

release_store:
  kind: file
  # Empty means <resolved project_root>/releases.
  root: ""
  publish_on_sync: true
  # Normal standalone UX exposes one active release. Older immutable releases are
  # archived and remain addressable by exact ID for audit/replay.
  active_keep: 1

qlib:
  # Optional .env overrides are explicitly scoped to this standalone profile, so
  # process-global CI/user variables cannot silently alter unrelated custom configs.
  repo_path: ""
  repo_path_env: QLIB_REPO
  dataset_dir: ""
  dataset_dir_env: QLIB_DATA_URI
  versions_root: ""
  dataset_name: cn_standalone
  dataset_version: local
  dataset_ref: standalone-current

production:
  daily_run:
    # Canonical schedule source consumed by tq-render-scheduler. OS-specific
    # systemd/launchd definitions must not carry an independent clock value.
    schedule:
      time: "18:30"
      timezone: Asia/Shanghai
    freshness:
      # Reject an apparently complete target day when its market cross-section is
      # materially smaller than the previous trading session.
      min_market_coverage_ratio: 0.95
      # CSI300/index_weight is snapshot-oriented. An older PIT snapshot may remain
      # effective, but beyond this age it is treated as provider/metadata staleness.
      max_universe_snapshot_age_calendar_days: 45
    verification:
      mode: sampled
      sample_size: 64
      workers: 2
    # Frozen Alpha158/Qlib baseline regression is supported by tq-daily-run but
    # remains opt-in because it is intentionally much heavier than data ingestion.
    # Enable only after the local official-parity baseline (#130) is certified.
    regression:
      enabled: false
    notify: true
