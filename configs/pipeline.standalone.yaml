extends: pipeline_tushare_dev.yaml

# Default autonomous Research Plane profile.  All paths are local and no
# Platform or TuShare credential is required merely to load the application.
mode: standalone
project_root: ./data
project_root_env: QLIB_DATA_ROOT

experiment:
  # The base TuShare profile is bound to cn_tushare_v1. Standalone research may
  # instead use an immutable local DatasetVersion with no DataRelease lineage, so
  # explicitly clear the inherited release binding. If the materialized manifest
  # carries data_release_id, the canonical dataset identity still comes from it.
  data_release: null
  alpha:
    pack: alpha158_market_v1

storage:
  registry_path: ""

data_source:
  kind: auto

release_store:
  kind: file
  # Empty means <resolved project_root>/releases, including QLIB_DATA_ROOT overrides.
  root: ""
  publish_on_sync: true

qlib:
  repo_path: ""
  dataset_dir: ""
  versions_root: ""
  dataset_name: cn_standalone
  dataset_version: local
  # Keep the standalone alias distinct from the inherited cn_tushare registry alias.
  dataset_ref: standalone-current
