project_root: ./data
start_date: "20230801"
end_date: "20260807"
calendar_end_date: "20261231"

data_source:
  # Use `tushare` for API pulls or `lean_mysql` to read from lean-platform MySQL.
  kind: tushare
  mysql:
    # `lean_canonical_v1` reads lean-platform's governed canonical tables.
    schema: lean_canonical_v1
    source: tushare
    universe: CSI300
    readonly: true
    batch_size: 100000
    # Either use DSN or explicit host/user/password/database.
    # dsn: ${LEAN_MYSQL_DSN}
    host: ""
    port: 3306
    user: ""
    password: ""
    database: ""
    charset: utf8mb4
    connect_timeout: 10
    # Optional table remapping for legacy database schemas.
    tables: {}
    # Optional per-endpoint SQL override, used when table/column naming differs.
    # Query placeholders are `%(trade_date)s`, `%(exchange)s`, `%(list_status)s`, etc.
    endpoints: {}

tushare:
  calls_per_minute: 180
  max_attempts: 6
  base_sleep_seconds: 2.0
  max_sleep_seconds: 60.0
  jitter_ratio: 0.15
  optional_endpoints:
    moneyflow: true
    stock_st: true
    suspend_d: true
    stk_limit: true

qlib:
  repo_path: ${QLIB_REPO}
  dataset_dir: ${QLIB_DATA_URI}
  frequency: day
  dataset_version: cn_tushare_v1
  export:
    copy_on_write_update: true
  include_fields:
    - open
    - high
    - low
    - close
    - volume
    - money
    - vwap
    - factor
    - change
    - paused
    - turnover_rate
    - turnover_rate_f
    - volume_ratio
    - pe
    - pe_ttm
    - pb
    - ps
    - ps_ttm
    - dv_ratio
    - dv_ttm
    - total_share
    - float_share
    - free_share
    - total_mv
    - circ_mv
    - net_mf_amount
    - big_net_amount
    - up_limit
    - down_limit
    - is_limit_up
    - is_limit_down
    - is_st
    - listed_days
    - roe_waa_pit
    - roa_pit
    - netprofit_margin_pit
    - netprofit_yoy_pit
    - or_yoy_pit
    - debt_to_assets_pit
    - ocf_to_or_pit

universe:
  min_listed_days: 120
  min_circ_mv_yuan: 2000000000
  min_money_20d_yuan: 20000000
  exclude_st: true
  allow_unknown_st: false

research:
  # Resolved relative to this pipeline config. Override with --model-profile.
  model_profile: model_profiles/lightgbm_auto.yaml
  min_history_days: 700
  # Align the forward-return label with TopkDropout hold_thresh.
  label_horizon_days: 5
  random_seed: 42
  num_threads: 8
  backtest_account: 500000
  allow_zero_benchmark: false
  deal_price: open
  limit_threshold: 0.095
  open_cost: 0.00035
  close_cost: 0.00085
  min_cost: 5
  benchmark: SH000300
  signal_lag_days: 1
  trade_unit: 100
  max_participation_rate: 0.05
  # Dirty revisions may produce research CANDIDATE runs, but can never be promoted.
  allow_dirty_research: true
  promotion_thresholds:
    min_observations: 252
    min_ic_mean: 0.01
    min_rank_ic_mean: 0.02
    min_icir: 0.50
    min_long_short_annualized: 0.05
    min_excess_ir: 0.50
    max_drawdown: 0.20
    require_unique_artifact: true

strategy:
  # Canonical strategy source for research, manifests, and execution.
  topk_dropout:
    topk: 30
    n_drop: 5
    hold_thresh: 5
    only_tradable: true
    forbid_all_trade_at_limit: true
    risk_degree: 0.95

portfolio:
  top_n: 20
  min_score: null
  weighting: score_vol
  max_position: 0.08
  max_exposure: 0.90
  max_group_exposure: 0.25
  max_turnover: 0.30
  min_position: 0.002
  volatility_floor: 0.01

execution:
  board_lot: 100
  max_participation_rate: 0.05
  commission_rate: 0.00025
  min_commission: 5
  stamp_duty_sell: 0.0005
  transfer_fee_rate: 0.00001
  price_buffer_buy: 0.002
  price_buffer_sell: 0.002
  block_limit_up_buy: true
  block_limit_down_sell: true
  # Execution snapshots are fail-closed without a current UTC capture timestamp.
  max_quote_age_seconds: 120
  max_position_age_seconds: 300

risk:
  max_gross_exposure: 0.95
  max_single_name: 0.10
  max_sector_exposure: 0.30
  max_daily_loss: 0.03
  kill_switch: false
