# Production research profile. Platform publishes the immutable DataRelease;
# Qlib only validates it and materializes the explicit qlib_staging component.
project_root: ${QUANT_DATA_ROOT}/derived/qlib/${DATASET_RELEASE_ID}
storage:
  registry_path: ${QUANT_DATA_ROOT}/derived/qlib/registry/qlib.sqlite
start_date: "20160104"
end_date: "20260810"
calendar_end_date: "20261231"

data_source:
  kind: platform_release
  platform_release:
    id: ${DATASET_RELEASE_ID}
    data_root: ${QUANT_DATA_ROOT}
    manifest: ${QUANT_DATA_ROOT}/releases/${DATASET_RELEASE_ID}/manifest.json
    universe: CSI300
    qlib_staging_role: qlib_staging

# Kept as an empty mapping because the shared Settings schema supports the
# explicit configs/pipeline_tushare_dev.yaml profile.
tushare: {}

qlib:
  repo_path: ${QLIB_REPO}
  dataset_dir: ${QUANT_DATA_ROOT}/derived/qlib/${DATASET_RELEASE_ID}/current
  frequency: day
  dataset_version: ${DATASET_RELEASE_ID}
  dataset_name: cn_platform_release
  dataset_ref: research-current
  versions_root: ${QUANT_DATA_ROOT}/derived/qlib/${DATASET_RELEASE_ID}/versions
  export:
    copy_on_write_update: true
    max_workers: 4
    backup_keep: 3
  include_fields:
    - open
    - high
    - low
    - close
    - volume
    - money
    - vwap
    - factor
    - change
    - paused
    - turnover_rate
    - turnover_rate_f
    - volume_ratio
    - pe
    - pe_ttm
    - pb
    - ps
    - ps_ttm
    - dv_ratio
    - dv_ttm
    - total_share
    - float_share
    - free_share
    - total_mv
    - circ_mv
    - net_mf_amount
    - big_net_amount
    - up_limit
    - down_limit
    - is_limit_up
    - is_limit_down
    - is_st
    - listed_days
    - roe_waa_pit
    - roa_pit
    - netprofit_margin_pit
    - netprofit_yoy_pit
    - or_yoy_pit
    - debt_to_assets_pit
    - ocf_to_or_pit

universe:
  instruments: csi300
  label: PIT CSI300
  index_code: 399300.SZ
  membership_file: ${QUANT_DATA_ROOT}/derived/qlib/${DATASET_RELEASE_ID}/pit_universe.parquet
  membership_effective_lag_days: 1
  min_listed_days: 120
  min_circ_mv_yuan: 2000000000
  min_money_20d_yuan: 20000000
  exclude_st: true
  allow_unknown_st: false

research:
  model_profile: model_profiles/lightgbm_auto.yaml
  min_history_days: 2200
  label_horizon_days: 5
  random_seed: 42
  num_threads: 8
  qlib_kernels: 4
  joblib_backend: loky
  feature_store:
    enabled: true
    format: parquet
    partition: year
  walk_forward:
    train_days: 1500
    valid_days: 126
    test_days: 63
    min_rolling_oos_observations: 252
    min_holdout_observations: 252
    purge_days: 6
    embargo_days: 6
    label_buffer_days: 6
  backtest_account: 500000
  allow_zero_benchmark: false
  deal_price: open
  limit_threshold: 0.095
  open_cost: 0.00035
  close_cost: 0.00085
  min_cost: 5
  benchmark: SH000300
  signal_lag_days: 1
  trade_unit: 100
  max_participation_rate: 0.05
  allow_dirty_research: true
  promotion_thresholds:
    min_observations: 252
    min_ic_mean: 0.01
    min_rank_ic_mean: 0.02
    min_icir: 0.50
    min_long_short_annualized: 0.05
    min_rank_icir: 0.50
    review_min_icir: 0.30
    review_min_rank_icir: 0.40
    min_excess_ir: 0.50
    max_drawdown: 0.20
    require_unique_artifact: true

strategy:
  topk_dropout:
    topk: 30
    n_drop: 5
    hold_thresh: 5
    only_tradable: true
    forbid_all_trade_at_limit: true
    risk_degree: 0.95

portfolio:
  top_n: 20
  min_score: null
  weighting: score_vol
  max_position: 0.08
  max_exposure: 0.90
  max_group_exposure: 0.25
  max_turnover: 0.30
  min_position: 0.002
  volatility_floor: 0.01


risk:
  max_gross_exposure: 0.95
  max_single_name: 0.10
  max_sector_exposure: 0.30
  max_daily_loss: 0.03
  kill_switch: false
  exposure_overlay:
    enabled: false
    target_annual_volatility: 0.15
    soft_drawdown: 0.10
    hard_drawdown: 0.20
    minimum_signal_dispersion: 0.05
    minimum_exposure_scale: 0.0
    maximum_exposure_scale: 1.0
