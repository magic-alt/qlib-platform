project_root: ./data
start_date: "20160101"
end_date: "20260806"
calendar_end_date: "20261231"

tushare:
  calls_per_minute: 180
  max_attempts: 6
  base_sleep_seconds: 2.0
  max_sleep_seconds: 60.0
  jitter_ratio: 0.15
  optional_endpoints:
    moneyflow: true
    stock_st: true
    suspend_d: true
    stk_limit: true

qlib:
  repo_path: ${QLIB_REPO}
  dataset_dir: ${QLIB_DATA_URI}
  frequency: day
  dataset_version: cn_tushare_v1
  export:
    copy_on_write_update: true
  include_fields:
    - open
    - high
    - low
    - close
    - volume
    - money
    - vwap
    - factor
    - change
    - paused
    - turnover_rate
    - turnover_rate_f
    - volume_ratio
    - pe
    - pe_ttm
    - pb
    - ps
    - ps_ttm
    - dv_ratio
    - dv_ttm
    - total_share
    - float_share
    - free_share
    - total_mv
    - circ_mv
    - net_mf_amount
    - big_net_amount
    - up_limit
    - down_limit
    - is_limit_up
    - is_limit_down
    - is_st
    - listed_days

universe:
  min_listed_days: 120
  min_circ_mv_yuan: 2000000000
  min_money_20d_yuan: 20000000
  exclude_st: true
  allow_unknown_st: false

research:
  min_history_days: 756
  random_seed: 42
  num_threads: 8
  backtest_account: 100000000
  allow_zero_benchmark: false
  deal_price: open
  limit_threshold: 0.095
  open_cost: 0.00035
  close_cost: 0.00085
  min_cost: 5
  promotion_thresholds:
    min_observations: 252
    min_ic_mean: 0.01
    min_rank_ic_mean: 0.02
    min_icir: 0.50
    min_long_short_annualized: 0.05
    min_excess_ir: 0.50
    max_drawdown: 0.20
    require_unique_artifact: true

execution:
  board_lot: 100
  max_participation_rate: 0.05
  commission_rate: 0.00025
  min_commission: 5
  stamp_duty_sell: 0.0005
  transfer_fee_rate: 0.00001
  price_buffer_buy: 0.002
  price_buffer_sell: 0.002
  block_limit_up_buy: true
  block_limit_down_sell: true
