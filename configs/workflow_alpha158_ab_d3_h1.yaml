# Orthogonal portfolio ablation B: fixed Alpha158 model/data chain, D3/H1/V5.
sys:
  path:
    - ./src

qlib_init:
  provider_uri: '{{ QLIB_DATA_URI }}'
  region: cn
  kernels: 4
  joblib_backend: loky

experiment_name: tushare_alpha158_lgb
market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
  start_time: "2018-10-01"
  end_time: "2026-08-10"
  fit_start_time: "2018-10-01"
  fit_end_time: "2024-12-27"
  instruments: *market
  label:
    - ["Ref($close, -6)/Ref($close, -1) - 1"]
    - ["LABEL0"]
  shared_processors:
    - class: AshareUniverseFilter
      module_path: qlib_platform.data.processors
      kwargs:
        min_listed_days: 120
        min_circ_mv_yuan: 2000000000
        min_money_20d_yuan: 20000000
        exclude_st: true
        allow_unknown_st: false
  infer_processors:
    - class: ProcessInfSingleThread
      module_path: qlib_platform.data.processors
    - class: RobustZScoreNorm
      kwargs: {fields_group: feature, clip_outlier: true}
    - class: Fillna
      kwargs: {fields_group: feature}
  learn_processors:
    - class: DropnaLabel
    - class: CSRankNorm
      kwargs: {fields_group: label}

task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      learning_rate: 0.03
      num_leaves: 63
      max_depth: 8
      colsample_bytree: 0.8
      subsample: 0.8
      lambda_l1: 10.0
      lambda_l2: 50.0
      device_type: cpu
      max_bin: 63
      num_threads: 8
      early_stopping_rounds: 100
      num_boost_round: 2000
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: TushareAlpha158Fundamental
        module_path: qlib_platform.data.custom_handler
        kwargs: *data_handler_config
      segments:
        train: ["2018-10-01", "2024-12-27"]
        valid: ["2025-01-08", "2025-07-02"]
        test: ["2025-07-11", "2026-08-10"]
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs: {model: <MODEL>, dataset: <DATASET>}
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs: {ana_long_short: true, ann_scaler: 252}
    - class: ASharePortAnaRecord
      module_path: qlib_platform.backtesting.workflow_records
      kwargs:
        config:
          strategy:
            class: TopkDropoutStrategy
            module_path: qlib.contrib.strategy
            kwargs:
              signal: <PRED>
              topk: 10
              n_drop: 3
              hold_thresh: 1
              only_tradable: true
              forbid_all_trade_at_limit: true
              risk_degree: 0.95
          executor:
            class: SimulatorExecutor
            module_path: qlib.backtest.executor
            kwargs: {time_per_step: day, generate_portfolio_metrics: true}
          backtest:
            start_time: "2025-07-11"
            end_time: "2026-08-10"
            account: 500000
            benchmark: *benchmark
            exchange_kwargs:
              limit_threshold: ["$is_limit_up > 0", "$is_limit_down > 0"]
              deal_price: open
              volume_threshold: [current, "$volume * 0.05"]
              trade_unit: 100
              open_cost: 0.0001
              close_cost: 0.0006
              min_cost: 0
