name: lightgbm_qlib_alpha158_official_v1
family: lightgbm
device: auto
device_index: 0
model_kwargs:
  # Mirrors Microsoft's current Alpha158 LightGBM benchmark recipe.  Parameters
  # that the upstream YAML leaves to LGBModel/LightGBM defaults are made explicit
  # so qlib-platform adapter defaults cannot silently change this control.
  loss: mse
  colsample_bytree: 0.8879
  learning_rate: 0.2
  subsample: 0.8789
  lambda_l1: 205.6999
  lambda_l2: 580.9768
  max_depth: 8
  num_leaves: 210
  num_threads: 20
  early_stopping_rounds: 50
  num_boost_round: 1000
  max_bin: 255
