name: PR 87 portability fix (one-shot)

on:
  push:
    branches:
      - refactor/remove-phase-research-legacy

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.10'
      - name: Fix canonical implementation hash resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/qlib_platform/research/diagnostics/portability.py')
          text = path.read_text(encoding='utf-8')
          old = (
              "    implementation_root = Path(__file__).resolve().parent\n"
              "    for name, expected in _mapping(\n"
              "        lineage.get(\"implementationSha256\"), \"Phase 3 implementation hashes\"\n"
              "    ).items():\n"
              "        target = implementation_root / str(name)\n"
              "        if not target.is_file() or sha256_file(target) != expected:\n"
              "            raise ValueError(f\"portable verification implementation drift: {name}\")\n"
          )
          new = (
              "    implementation_root = Path(__file__).resolve().parents[1]\n"
              "    for name, expected in _mapping(\n"
              "        lineage.get(\"implementationSha256\"), \"Phase 3 implementation hashes\"\n"
              "    ).items():\n"
              "        relative = Path(str(name))\n"
              "        if relative.is_absolute() or \"..\" in relative.parts:\n"
              "            raise ValueError(f\"portable verification implementation path is unsafe: {name}\")\n"
              "        target = (implementation_root / relative).resolve()\n"
              "        _inside(implementation_root, target, f\"Phase 3 implementation {name}\")\n"
              "        if target.is_symlink() or not target.is_file() or sha256_file(target) != expected:\n"
              "            raise ValueError(f\"portable verification implementation drift: {name}\")\n"
          )
          if old not in text:
              raise SystemExit('expected portability verifier block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Run portability and architecture tests
        run: python -m pytest -q tests/test_stability_portability.py tests/research/test_module_architecture.py
      - name: Validate quality
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          git diff --check
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr87-portability-fix-once.yml
          git add -A
          git commit -m 'fix: resolve stability implementation hashes from research root'
          git push origin HEAD:refactor/remove-phase-research-legacy
