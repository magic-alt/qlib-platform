name: PR145 CI Autofix

on:
  push:
    branches:
      - fix/134-research-lineage-run-identity

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[ci-autofix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Move lineage code to responsibility packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/qlib_platform/research/evidence src/qlib_platform/research/interfaces
          git mv src/qlib_platform/research/run_manifest.py src/qlib_platform/research/evidence/run_manifest.py
          git mv src/qlib_platform/research/run_adapters.py src/qlib_platform/research/evidence/run_adapters.py
          git mv src/qlib_platform/research/run_cli.py src/qlib_platform/research/interfaces/run_cli.py
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "qlib_platform.research.run_manifest": "qlib_platform.research.evidence.run_manifest",
              "qlib_platform.research.run_adapters": "qlib_platform.research.evidence.run_adapters",
              "qlib_platform.research.run_cli": "qlib_platform.research.interfaces.run_cli",
          }
          for root in (Path("src"), Path("tests")):
              for path in root.rglob("*.py"):
                  text = path.read_text(encoding="utf-8")
                  updated = text
                  for before, after in replacements.items():
                      updated = updated.replace(before, after)
                  if updated != text:
                      path.write_text(updated, encoding="utf-8")

          manifest = Path("src/qlib_platform/research/evidence/run_manifest.py")
          text = manifest.read_text(encoding="utf-8")
          text = text.replace(
              "Path(__file__).resolve().parents[3]",
              "Path(__file__).resolve().parents[4]",
          )
          manifest.write_text(text, encoding="utf-8")

          daily = Path("src/qlib_platform/runtime/production_daily_run_entrypoint.py")
          text = daily.read_text(encoding="utf-8")
          text = text.replace(
              "production_daily_run.DailyResearchRun = ManifestDailyResearchRun",
              "setattr(production_daily_run, \"DailyResearchRun\", ManifestDailyResearchRun)",
          )
          text = text.replace(
              "production_daily_run.DailyResearchRun = original",
              "setattr(production_daily_run, \"DailyResearchRun\", original)",
          )
          daily.write_text(text, encoding="utf-8")
          PY
      - name: Apply Ruff lint fixes and formatting
        run: |
          python -m pip install 'ruff>=0.8,<1'
          ruff check --fix src tests
          ruff format src tests
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ci): align lineage packages, typing, and formatting [ci-autofix]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
