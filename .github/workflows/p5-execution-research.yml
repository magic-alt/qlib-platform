name: P5 Institutional Execution Contract

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: p5-execution-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  institutional-execution-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository contract dependencies
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Verify P5-C execution research and P5-A/P5-B regressions
        run: >-
          python -m pytest -q
          tests/test_institutional_execution_research.py
          tests/test_institutional_portfolio_construction.py
          tests/test_institutional_risk_platform.py
          tests/test_portfolio_optimizer_risk_model.py
      - name: Verify P5-C lint contract
        run: >-
          python -m ruff check
          src/qlib_platform/research/execution
          tests/test_institutional_execution_research.py
      - name: Verify P5-C formatting contract
        run: >-
          python -m ruff format --check
          src/qlib_platform/research/execution
          tests/test_institutional_execution_research.py
      - name: Verify P5-C typing contract
        run: >-
          python -m mypy
          src/qlib_platform/research/execution
          src/qlib_platform/backtesting/execution_audit.py
