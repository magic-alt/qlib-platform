name: Research formatting cleanup (one-shot)

on:
  push:
    branches:
      - refactor/remove-phase-research-legacy
    paths:
      - .github/workflows/research-format-cleanup-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-phase-research-legacy
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install CI Ruff version
        run: python -m pip install 'ruff==0.16.5'
      - name: Format source and tests
        run: python -m ruff format src tests
      - name: Commit formatting and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/research-format-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formatting changes produced" >&2
            exit 1
          fi
          git commit -m "style: format responsibility-oriented research migration"
          git push origin HEAD:refactor/remove-phase-research-legacy
