name: Phase 3 CI Fixup

on:
  push:
    branches:
      - refactor/phase3-transitional-architecture

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply exact Phase 3 CI fixups
        run: python scripts/fix_phase3_ci.py
      - name: Verify syntax and architecture targets
        run: |
          python -m compileall -q src/qlib_platform tests/test_cli.py tests/test_architecture_phase3.py
          test ! -e src/qlib_platform/data/_legacy_ingestion.py
          test ! -e src/qlib_platform/data/sources/client.py
          test ! -e src/qlib_platform/cli.py
          ! grep -R 'qlib_platform.data.sources.tushare\|qlib_platform.data.sources.mysql' src/qlib_platform/data/ingestion.py
      - name: Remove one-shot fixer and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/fix_phase3_ci.py .github/workflows/phase3-ci-fixup.yml
          git add src/qlib_platform/data/ingestion.py tests/test_cli.py tests/test_architecture_phase3.py docs/package_architecture.md
          git commit -m 'fix(refactor): close phase3 CI compatibility gaps'
          git push origin HEAD:refactor/phase3-transitional-architecture
