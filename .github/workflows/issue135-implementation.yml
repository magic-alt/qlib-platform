name: Issue135 SRE Integration

on:
  push:
    branches:
      - fix/135-research-platform-sre

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[issue135-integrated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply integration patch
        run: |
          python scripts/issue135_integrate.py
          python scripts/issue135_prevalidate_fix.py
          python scripts/issue135_testfix.py
      - name: Validate integration
        run: |
          python -m pip install -c constraints/ci.txt -e '.[dev]'
          ruff check --fix src tests scripts/issue135_integrate.py scripts/issue135_prevalidate_fix.py scripts/issue135_testfix.py
          ruff format src tests scripts/issue135_integrate.py scripts/issue135_prevalidate_fix.py scripts/issue135_testfix.py
          ruff check src tests scripts/issue135_integrate.py scripts/issue135_prevalidate_fix.py scripts/issue135_testfix.py
          ruff format --check src tests scripts/issue135_integrate.py scripts/issue135_prevalidate_fix.py scripts/issue135_testfix.py
          mypy src
          pytest -q tests/test_sre_contract.py
          python scripts/check_docs.py --root .
      - name: Commit integrated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue135-implementation.yml scripts/issue135_integrate.py scripts/issue135_prevalidate_fix.py scripts/issue135_testfix.py
          git add -A
          git commit -m "feat(sre): integrate versioned SLO gate and recovery evidence [issue135-integrated]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
