name: Research architecture migration (one-shot)

on:
  push:
    branches:
      - refactor/remove-phase-research-legacy
    paths:
      - scripts/research_refactor_once.py
      - scripts/patch_research_refactor_once.py
      - .github/workflows/research-refactor-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refactor/remove-phase-research-legacy
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Patch migration guard
        run: python scripts/patch_research_refactor_once.py
      - name: Apply responsibility-oriented research migration
        run: python scripts/research_refactor_once.py
      - name: Validate Python syntax
        run: python -m compileall -q src tests
      - name: Validate staged diff and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --name-status
          if git diff --cached --quiet; then
            echo "No migration changes produced" >&2
            exit 1
          fi
          git commit -m "refactor: remove phase-oriented research legacy"
          git push origin HEAD:refactor/remove-phase-research-legacy
