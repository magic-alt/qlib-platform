name: PR 87 CI fix v2 (one-shot)

on:
  push:
    branches:
      - refactor/remove-phase-research-legacy

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply validated migration repair and docs-governance update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source = subprocess.check_output(
              ["git", "show", "8f2e8121cbd4ec5e42a67a8220955c3f5490a7d2:.github/workflows/pr87-ci-fix-once.yml"],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          repair_code = textwrap.dedent(source[start:end])
          exec(compile(repair_code, "<pr87-repair>", "exec"), {})

          path = Path("src/qlib_platform/docs_check.py")
          text = path.read_text(encoding="utf-8")
          old = '''        historical_link = re.compile(\n            r"\\((?:docs/)?(?:history/(?:research|qrun)/)?"\n            r"(?:alpha_research_phase_[12]|p0_research_baseline|"\n            r"local_alpha158_qrun_backtest)\\.md"\n        )\n'''
          new = '''        historical_link = re.compile(\n            r"\\((?:docs/)?(?:history/(?:research|qrun)/)?"\n            r"(?:alpha_research_(?:phase_[12]|initial_synthesis|candidate_program)|"\n            r"p0_research_baseline|local_alpha158_qrun_backtest)\\.md"\n        )\n'''
          if old not in text:
              raise SystemExit("DOC-008 historical-link matcher did not match expected source")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Remove transient repair workflows before architecture tests
        run: git rm .github/workflows/pr87-ci-fix-once.yml .github/workflows/pr87-ci-fix-v2.yml
      - name: Install test dependencies
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Format and lint repaired tree
        run: |
          python -m ruff format src tests
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Run previously failing tests
        run: >-
          python -m pytest -q
          tests/research/test_module_architecture.py
          tests/test_docs_check.py
          tests/test_failure_attribution.py
          tests/test_feature_store.py
          tests/test_research_execution_boundary_v2.py
          tests/test_research_study.py
          tests/test_research_synthesis.py
          tests/test_walk_forward.py
      - name: Validate diff
        run: git diff --check
      - name: Commit repaired tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: complete research responsibility migration'
          git push origin HEAD:refactor/remove-phase-research-legacy
