name: P5 Enterprise Research Management Contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p5-enterprise-management-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enterprise-research-management-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Verify P5-D management and P5-A/P5-B/P5-C regressions
        run: >-
          python -m pytest -q
          tests/test_enterprise_research_management.py
          tests/test_research_management_service.py
          tests/test_comprehensive_checks.py
          tests/test_institutional_risk_platform.py
          tests/test_institutional_portfolio_construction.py
          tests/test_institutional_execution_research.py
          tests/test_portfolio_optimizer_risk_model.py
          tests/test_local_auth.py
      - name: Verify P5-D unit coverage
        run: >-
          python -m pytest -q
          tests/test_enterprise_research_management.py
          tests/test_research_management_service.py
          tests/test_local_auth.py
          --cov=src/qlib_platform/auth
          --cov=src/qlib_platform/research/management
          --cov-report=term-missing
          --cov-fail-under=85
      - name: Verify P5-D lint contract
        run: >-
          python -m ruff check
          src/qlib_platform/auth
          src/qlib_platform/research/management
          tests/test_enterprise_research_management.py
          tests/test_research_management_service.py
          tests/test_comprehensive_checks.py
          scripts/run_comprehensive_checks.py
      - name: Verify P5-D formatting contract
        run: >-
          python -m ruff format --check
          src/qlib_platform/auth
          src/qlib_platform/research/management
          tests/test_enterprise_research_management.py
          tests/test_research_management_service.py
          tests/test_comprehensive_checks.py
          scripts/run_comprehensive_checks.py
      - name: Verify P5-D typing contract
        run: python -m mypy src/qlib_platform/auth src/qlib_platform/research/management
