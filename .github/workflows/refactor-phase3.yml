name: Refactor Phase 3

on:
  push:
    branches:
      - refactor/phase3-transitional-architecture

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply Phase 3 architecture codemod when needed
        run: |
          if test -e src/qlib_platform/data/_legacy_ingestion.py; then
            python scripts/apply_phase3_architecture.py
          else
            echo 'Phase 3 codemod already applied.'
          fi
      - name: Format migrated Python
        run: |
          python -m pip install 'ruff>=0.8,<1'
          python -m ruff check --fix src tests
          python -m ruff format src tests
      - name: Compile package
        run: python -m compileall -q src/qlib_platform
      - name: Verify architectural invariants before commit
        run: |
          test ! -e src/qlib_platform/data/_legacy_ingestion.py
          test ! -e src/qlib_platform/data/sources/client.py
          test ! -e src/qlib_platform/cli.py
          test -e src/qlib_platform/cli/main.py
          test -e src/qlib_platform/cli/parser.py
          ! grep -R 'qlib_platform.data.sources.tushare\|qlib_platform.data.sources.mysql' src/qlib_platform/data/ingestion.py
      - name: Commit generated refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: remove transitional ingestion and split CLI composition'
          git push origin HEAD:refactor/phase3-transitional-architecture
