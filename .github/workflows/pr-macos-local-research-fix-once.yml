name: macOS local research recovery fix (one-shot)

on:
  push:
    branches:
      - fix/macos-local-research-alias-recovery

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Apply local research recovery patch
        run: |
          python scripts/pr_macos_local_research_fix.py
          python scripts/pr_macos_local_research_fix_followup.py
      - name: Remove transient migration assets
        run: >-
          git rm
          scripts/pr_macos_local_research_fix.py
          scripts/pr_macos_local_research_fix_followup.py
          .github/workflows/pr-macos-local-research-fix-once.yml
      - name: Install test dependencies
        run: python -m pip install -c constraints/ci.txt -e '.[dev]'
      - name: Format and lint
        run: |
          python -m ruff format src tests
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Run stateful local research regression tests
        run: >-
          python -m pytest -q
          tests/test_bootstrap.py
          tests/test_research_quickstart.py
          tests/test_data_source_resolver.py
      - name: Validate workflow YAML and diff
        run: |
          python -c "from pathlib import Path; import yaml; p=yaml.safe_load(Path('.github/workflows/ci.yml').read_text()); assert isinstance(p, dict)"
          git diff --check
      - name: Commit repaired tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: recover local research aliases across platforms'
          git push origin HEAD:fix/macos-local-research-alias-recovery
