name: P129 final one-shot format

on:
  push:
    branches:
      - fix/129-daily-production-dag

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.5'
      - run: python -m ruff format src tests scripts
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests scripts
          git commit -m 'fix(ci): format final p129 coverage tests'
          git push origin HEAD:fix/129-daily-production-dag
