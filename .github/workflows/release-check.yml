name: Release Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "constraints/**"
      - "src/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-sbom:
    name: package-sbom
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.6.0" "cyclonedx-bom==7.3.1"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-test built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .release-check-venv
          .release-check-venv/bin/python -m pip install --upgrade pip
          .release-check-venv/bin/python -m pip install dist/*.whl
          .release-check-venv/bin/python - <<'PY'
          import importlib.metadata
          import tushare_qlib

          print(importlib.metadata.version("tushare-qlib-a-share"))
          print(tushare_qlib.__name__)
          PY

      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          cyclonedx-py environment \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --output-file dist/sbom.cdx.json \
            .release-check-venv/bin/python

      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Upload release-check bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-check
          path: dist/*
          if-no-files-found: error
          retention-days: 7
