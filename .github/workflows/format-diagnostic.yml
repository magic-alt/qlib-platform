name: Format diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.12.0'
      - name: Show exact Ruff formatter diff
        run: python -m ruff format --diff src/tushare_qlib/daily_sync.py src/tushare_qlib/extended_parallel.py
