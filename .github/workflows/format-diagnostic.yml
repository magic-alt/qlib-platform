name: Format diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  ruff-format-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.12.0'
      - name: Apply Ruff formatter
        run: python -m ruff format src/tushare_qlib/daily_sync.py src/tushare_qlib/extended_parallel.py
      - name: Commit formatter result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/tushare_qlib/daily_sync.py src/tushare_qlib/extended_parallel.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style(data): apply Ruff formatter'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
