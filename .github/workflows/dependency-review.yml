name: Dependency Review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check dependency graph availability
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/dependency-review-api.json"
          url="https://api.github.com/repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}"
          status="$(curl --silent --show-error --location \
            --output "$response" \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "$url")"

          fallback=false
          case "$status" in
            200)
              echo "available=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              fallback=true
              ;;
            403)
              if [[ "$REPOSITORY_VISIBILITY" == "public" ]] \
                && grep -Eq '"message"[[:space:]]*:[[:space:]]*"Forbidden"' "$response"; then
                fallback=true
              else
                echo "::error::Dependency Review API probe failed with HTTP 403."
                cat "$response"
                exit 1
              fi
              ;;
            *)
              echo "::error::Dependency Review API probe failed with HTTP ${status}."
              cat "$response"
              exit 1
              ;;
          esac

          if [[ "$fallback" == "true" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Graph is unavailable; using the fail-closed Python dependency fallback. Enable Dependency Graph in Settings > Security > Advanced Security to restore the native dependency review path."
          fi

      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

      - name: Check out pull request head for fallback audit
        if: steps.dependency-graph.outputs.available == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python for fallback audit
        if: steps.dependency-graph.outputs.available == 'false'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Audit changed Python dependencies
        if: steps.dependency-graph.outputs.available == 'false'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          audit_file="$RUNNER_TEMP/dependency-review-requirements.txt"
          changed_files="$RUNNER_TEMP/dependency-review-changed-files.txt"
          base_pyproject="$RUNNER_TEMP/dependency-review-base-pyproject.toml"
          head_pyproject="$RUNNER_TEMP/dependency-review-head-pyproject.toml"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          manifest_changed=false
          pyproject_changed=false
          while IFS= read -r file; do
            case "$file" in
              pyproject.toml)
                pyproject_changed=true
                ;;
              requirements*.txt|constraints/*.txt)
                manifest_changed=true
                ;;
            esac
          done < "$changed_files"

          if [[ "$pyproject_changed" == "true" ]]; then
            git show "$BASE_SHA:pyproject.toml" > "$base_pyproject"
            git show "$HEAD_SHA:pyproject.toml" > "$head_pyproject"
            if ! python - "$base_pyproject" "$head_pyproject" <<'PY'
          import sys
          import tomllib

          def dependency_contract(path: str) -> dict[str, object]:
              with open(path, "rb") as handle:
                  data = tomllib.load(handle)
              project = data.get("project", {})
              build = data.get("build-system", {})
              return {
                  "build-system.requires": build.get("requires", []),
                  "project.dependencies": project.get("dependencies", []),
                  "project.optional-dependencies": project.get("optional-dependencies", {}),
              }

          if dependency_contract(sys.argv[1]) != dependency_contract(sys.argv[2]):
              raise SystemExit(1)
          PY
            then
              manifest_changed=true
            else
              echo "pyproject.toml changed outside dependency declarations; dependency fallback remains applicable."
            fi
          fi

          git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- \
            'constraints/*.txt' 'requirements*.txt' \
            | awk '
              /^\+[^+]/ {
                line = substr($0, 2)
                if (line ~ /^[[:alnum:]_.-]+==[^[:space:]]+$/) {
                  print line
                }
              }
            ' \
            | sort -u > "$audit_file"

          if [[ ! -s "$audit_file" ]]; then
            if [[ "$manifest_changed" == "true" ]]; then
              echo "::error::Dependency declarations changed, but the fallback could not derive exact pinned additions to audit. Enable GitHub Dependency Graph or add/update the corresponding exact pin under constraints/."
              exit 1
            fi
            echo "No dependency declaration changes detected; nothing to audit."
            exit 0
          fi

          echo "Fallback dependency audit targets:"
          cat "$audit_file"
          python -m pip install 'pip-audit==2.10.1'
          python -m pip_audit \
            --requirement "$audit_file" \
            --strict \
            --progress-spinner off
