name: P129 one-shot autofix

on:
  push:
    branches:
      - fix/129-daily-production-dag

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.16.5'
      - name: Apply narrow typing fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          planned = 'src/qlib_platform/data/planned_daily_sync.py'
          replace_once(
              planned,
              '    return pd.Timestamp(value).normalize().strftime("%Y%m%d")',
              '    return str(pd.Timestamp(value).normalize().strftime("%Y%m%d"))',
          )
          replace_once(
              planned,
              '        payload = json.loads(path.read_text(encoding="utf-8"))\n        if payload.get("schema_version") != PLAN_SCHEMA_VERSION:',
              '        payload = json.loads(path.read_text(encoding="utf-8"))\n        if not isinstance(payload, dict):\n            raise TypeError(f"daily sync plan must be a JSON object: {path}")\n        if payload.get("schema_version") != PLAN_SCHEMA_VERSION:',
          )
          replace_once(
              planned,
              '        return payload\n\n    def _save_plan',
              '        return dict(payload)\n\n    def _save_plan',
          )
          replace_once(
              planned,
              '            loaded = json.loads(path.read_text(encoding="utf-8"))\n            if loaded.get("schema_version") == APPLY_STATE_SCHEMA_VERSION:\n                return loaded',
              '            loaded = json.loads(path.read_text(encoding="utf-8"))\n            if isinstance(loaded, dict) and loaded.get("schema_version") == APPLY_STATE_SCHEMA_VERSION:\n                return dict(loaded)',
          )
          replace_once(
              planned,
              '    def _factor_event_symbols(self, plan: Mapping[str, Any]) -> set[str]:',
              '    def _planned_factor_event_symbols(self, plan: Mapping[str, Any]) -> set[str]:',
          )
          replace_once(
              planned,
              '        event_symbols = self._factor_event_symbols(plan)',
              '        event_symbols = self._planned_factor_event_symbols(plan)',
          )

          resumable = 'src/qlib_platform/data/resumable_certified_sync.py'
          replace_once(
              resumable,
              '        return super().create_plan(as_of=resolved, mode=mode)',
              '        return Path(super().create_plan(as_of=resolved, mode=mode))',
          )

          runtime = 'src/qlib_platform/runtime/production_daily_run.py'
          replace_once(
              runtime,
              '        self.sync = ResumableCertifiedDailySyncService(settings)',
              '        self.sync: ResumableCertifiedDailySyncService = ResumableCertifiedDailySyncService(settings)',
          )
      - name: Format repository Python
        run: python -m ruff format src tests scripts
      - name: Commit autofix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests scripts
          git commit -m 'fix(ci): format p129 code and tighten typing'
          git push origin HEAD:fix/129-daily-production-dag
