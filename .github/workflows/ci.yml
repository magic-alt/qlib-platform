name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure isolated Qlib paths
        run: |
          echo "QLIB_REPO=$RUNNER_TEMP/qlib-repo" >> "$GITHUB_ENV"
          echo "QLIB_DATA_URI=$RUNNER_TEMP/qlib-data" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/qlib-repo" "$RUNNER_TEMP/qlib-data"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: tq --config configs/pipeline.yaml validate-qrun-contract
      - run: pytest
