name: Refactor Domain Codemod

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  codemod:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/domain-layout-phase2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Apply domain layout migration
        run: python scripts/apply_domain_layout_phase2.py
      - name: Commit deterministic rewrite
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo 'No domain rewrite required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: group implementation modules by domain'
          git push origin "HEAD:${HEAD_REF}"
