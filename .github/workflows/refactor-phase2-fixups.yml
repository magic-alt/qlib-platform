name: Refactor Phase2 Fixups

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fixups:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'refactor/domain-layout-phase2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install formatter
        run: python -m pip install 'ruff==0.16.5'
      - name: Apply phase-2 recovery and lineage fixups
        run: python scripts/apply_phase2_fixups.py
      - name: Format migrated Python sources
        run: python -m ruff format src tests
      - name: Commit deterministic fixups
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo 'No phase-2 fixups required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format recovered domain migration'
          git push origin "HEAD:${HEAD_REF}"
