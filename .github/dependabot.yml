version: 2

# Keep Dependabot configuration explicit, but do not let scheduled version
# checks open pull requests automatically. Dependency upgrades are reviewed
# and batched manually so CI is not flooded by parallel bot PRs.
#
# Note: open-pull-requests-limit controls version-update PRs. Dependabot
# security-update PRs, if enabled in repository settings, are controlled
# separately by GitHub.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 0
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Compatibility-sensitive governed dependencies. Upgrade only in a
      # dedicated PR with Qlib/backtest validation evidence.
      - dependency-name: "pyqlib"
      - dependency-name: "lightgbm"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 0
    groups:
      github-actions:
        patterns:
          - "*"
