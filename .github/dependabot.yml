version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Compatibility-sensitive governed dependencies. Upgrade only in a
      # dedicated PR with Qlib/backtest validation evidence.
      - dependency-name: "pyqlib"
      - dependency-name: "lightgbm"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: "Asia/Singapore"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
